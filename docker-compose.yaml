services:
  fismed-be-staging:
    container_name: fismed-be-staging
    image: fismed-be-staging:latest
    build:
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8083:8080"              # Expose 8081 on the host, 8080 in the container
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - fismed-network
